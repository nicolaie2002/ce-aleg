<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Offline - Ce aleg?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #020617; color: white;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .container {
      width: 100%; max-width: 400px; text-align: center;
      background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; padding: 2.5rem;
    }
    .icon { width: 48px; height: 48px; margin: 0 auto 1.5rem; color: #22d3ee; }
    h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 1rem; }
    p { color: rgba(255,255,255,0.7); margin-bottom: 0.5rem; }
    .subtitle { font-size: 0.875rem; color: rgba(255,255,255,0.55); margin-bottom: 1.5rem; }
    button {
      background: white; color: #020617; border: none; border-radius: 8px;
      padding: 0.875rem 1.5rem; font-weight: 700; font-size: 1rem;
      cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem;
      transition: background 0.2s;
    }
    button:hover { background: #e0f2f1; }
    button:focus { outline: 2px solid #22d3ee; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M1 1l22 22M1 17a5 5 0 0 1 5-5h14M17 1v5h5"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
    <h1>Momentan ești offline</h1>
    <p>Reconectează-te pentru scanări, catalog și datele contului.</p>
    <p class="subtitle">You are offline. Reconnect to scan products and access your account.</p>
    <button onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Reîncearcă / Try again
    </button>
  </div>
</body>
</html>
