<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07110f">
    <title>Offline | Ce aleg?</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #07110f;
        color: #f4fffb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(20, 184, 140, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20, 184, 140, 0.08) 1px, transparent 1px),
          #07110f;
        background-size: 32px 32px;
      }

      main {
        width: min(100%, 560px);
        border: 1px solid rgba(151, 255, 222, 0.22);
        border-radius: 8px;
        padding: clamp(28px, 7vw, 48px);
        text-align: center;
        background: rgba(5, 15, 13, 0.94);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      }

      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: clamp(28px, 7vw, 42px);
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0 auto;
        max-width: 440px;
        color: #b8cbc5;
        font-size: 16px;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        margin-top: 28px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        padding: 0 22px;
        background: #8ef0ce;
        color: #04100c;
        font-weight: 800;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.png" alt="">
      <h1 id="offline-title">Momentan ești offline</h1>
      <p id="offline-description">
        Reconectează-te pentru scanări, catalog și datele contului. Răspunsurile private nu sunt păstrate în cache.
      </p>
      <a id="offline-action" href="/">Reîncearcă</a>
    </main>
    <script>
      try {
        if (localStorage.getItem("cealeg_locale") === "en") {
          document.documentElement.lang = "en";
          document.title = "Offline | Ce aleg?";
          document.getElementById("offline-title").textContent = "You are currently offline";
          document.getElementById("offline-description").textContent =
            "Reconnect to scan products, browse the catalog and access your account. Private responses are not stored in the cache.";
          document.getElementById("offline-action").textContent = "Try again";
        }
      } catch {
        // Romanian remains the safe default when storage is unavailable.
      }
    </script>
  </body>
</html>
