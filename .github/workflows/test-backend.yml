name: Backend tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      ALLOW_DEV_TUNNEL_ORIGINS: "false"
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install pytest pytest-cov ruff

      - name: Check Python sources
        run: |
          python -m py_compile \
            app.py \
            ai_provider.py \
            database.py \
            models.py \
            import_openfoodfacts_export.py \
            import_retailer_feed.py \
            migrate_sqlite_to_supabase.py \
            prewarm_openfoodfacts_catalog.py \
            recategorize_catalog.py
          ruff check \
            app.py \
            ai_provider.py \
            database.py \
            models.py \
            import_openfoodfacts_export.py \
            import_retailer_feed.py \
            migrate_sqlite_to_supabase.py \
            prewarm_openfoodfacts_catalog.py \
            recategorize_catalog.py \
            --select E9,F63,F7,F82

      - name: Smoke-test Flask application
        run: |
          python - <<'PY'
          from app import app

          response = app.test_client().get("/health")
          assert response.status_code == 200, response.get_data(as_text=True)
          assert response.get_json().get("ok") is True
          PY

      - name: Run backend tests
        shell: bash
        run: |
          if find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit 2>/dev/null | grep -q .; then
            python -m pytest tests \
              --cov=app \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --verbose
          else
            echo "No backend test files are present yet; the compile, lint, and Flask smoke checks still ran."
          fi

      - name: Upload backend coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' && hashFiles('backend/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
