name: Backend production release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA to deploy (defaults to current main)
        required: false
        type: string

concurrency:
  group: backend-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Manually deploy and verify a commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ inputs.commit_sha || github.sha }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Require release secrets
        shell: bash
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "::error::Missing repository secret: RENDER_DEPLOY_HOOK_URL"; exit 1; }

      - name: Trigger Render deploy
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen

          hook_url = os.environ["RENDER_DEPLOY_HOOK_URL"]
          release_sha = os.environ["RELEASE_SHA"]
          parsed = urlsplit(hook_url)
          query = parse_qsl(parsed.query, keep_blank_values=True)
          query.append(("ref", release_sha))
          deploy_url = urlunsplit(
              (parsed.scheme, parsed.netloc, parsed.path, urlencode(query), parsed.fragment)
          )

          try:
              with urlopen(Request(deploy_url, method="POST"), timeout=30) as response:
                  if response.status not in {200, 202}:
                      raise SystemExit(f"Render deploy hook returned HTTP {response.status}")
          except HTTPError as error:
              raise SystemExit(f"Render deploy hook returned HTTP {error.code}") from None
          except URLError:
              raise SystemExit("Render deploy hook request failed") from None
          PY

      - name: Wait for the released commit
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          expected = os.environ["RELEASE_SHA"].lower()
          base_url = "https://cealeg-api.onrender.com"
          deadline = time.monotonic() + 15 * 60
          last_detail = "no response"

          while time.monotonic() < deadline:
              try:
                  with urlopen(Request(f"{base_url}/health"), timeout=45) as response:
                      health = json.load(response)
                  with urlopen(Request(f"{base_url}/version"), timeout=45) as response:
                      version = json.load(response)

                  deployed = str(version.get("commit") or "").lower()
                  last_detail = (
                      f"health={health.get('ok')} deployed={deployed or 'unknown'} "
                      f"expected={expected}"
                  )
                  if health.get("ok") is True and deployed == expected:
                      print(f"Render release verified: {deployed[:7]}")
                      raise SystemExit(0)
              except (HTTPError, URLError, TimeoutError, ValueError) as error:
                  last_detail = f"waiting for Render: {type(error).__name__}"

              print(last_detail)
              time.sleep(15)

          raise SystemExit(f"Render did not publish the expected commit: {last_detail}")
          PY
