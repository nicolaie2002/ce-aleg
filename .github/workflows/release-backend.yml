name: Backend production release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: backend-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-and-deploy:
    name: Migrate, then deploy the same commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_SSLMODE: require
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Require release secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Missing production secret: PRODUCTION_DATABASE_URL"; exit 1; }
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Missing production secret: RENDER_DEPLOY_HOOK_URL"; exit 1; }

      - name: Run versioned migration release gate
        run: python migration.py release

      - name: Trigger Render deploy for migrated commit
        run: |
          python - <<'PY'
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen

          hook_url = os.environ["RENDER_DEPLOY_HOOK_URL"]
          release_sha = os.environ["RELEASE_SHA"]
          parsed = urlsplit(hook_url)
          query = parse_qsl(parsed.query, keep_blank_values=True)
          query.append(("ref", release_sha))
          deploy_url = urlunsplit(
              (parsed.scheme, parsed.netloc, parsed.path, urlencode(query), parsed.fragment)
          )

          try:
              with urlopen(Request(deploy_url, method="POST"), timeout=30) as response:
                  if response.status not in {200, 202}:
                      raise SystemExit(f"Render deploy hook returned HTTP {response.status}")
          except HTTPError as error:
              raise SystemExit(f"Render deploy hook returned HTTP {error.code}") from None
          except URLError:
              raise SystemExit("Render deploy hook request failed") from None
          PY
