name: Frontend tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node 22 quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit Node dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm exec -- tsc --noEmit

      - name: Run frontend tests
        run: npm run test:ci -- --runInBand --passWithNoTests

      - name: Upload frontend coverage
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' && hashFiles('frontend/coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Build production bundle
        env:
          BACKEND_URL: http://127.0.0.1:5001
          NEXT_PUBLIC_API_URL: /api/backend
        run: npm run build

      - name: Enforce route bundle budget
        run: npm run quality:bundle

      - name: Build Cloudflare Free target and enforce Worker limit
        env:
          BACKEND_URL: https://cealeg-api.onrender.com
          NEXT_PUBLIC_API_URL: /api/backend
          NEXT_PUBLIC_SITE_URL: https://www.cealeg.shop
          NEXT_PUBLIC_APP_ENV: production
        run: npm run quality:cloudflare

      - name: Smoke-test Cloudflare Workers runtime
        shell: bash
        run: |
          npx opennextjs-cloudflare preview > /tmp/cealeg-cloudflare.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 5 http://127.0.0.1:8787/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/cealeg-cloudflare.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/cealeg-cloudflare.log
            exit 1
          fi

          for path in / /help /pricing /catalog-romania/magazine/lidl /manifest.webmanifest; do
            curl --fail --silent --show-error --max-time 20 "http://127.0.0.1:8787${path}" > /dev/null
          done

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 http://127.0.0.1:8787/dashboard)"
          test "$status" = "307"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse quality gates
        run: npm run quality:lighthouse

      - name: Run accessibility tests
        env:
          BACKEND_URL: http://127.0.0.1:5001
          NEXT_PUBLIC_API_URL: /api/backend
        run: npm run test:a11y
