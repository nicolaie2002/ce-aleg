name: Production maintenance

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'nicolaie2002'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run protected backend maintenance
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET is not configured in GitHub Actions; maintenance was skipped."
            exit 0
          fi

          response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --max-time 180 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{"recategorize":true,"recategorizeLimit":300,"sendDigest":true,"digestLimit":100,"retention":true,"catalogQuality":true}' \
            https://cealeg-api.onrender.com/internal/cron/maintenance)"

          python - "$response" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])
          assert payload.get("ok") is True, payload
          print("Production maintenance completed successfully.")
          PY
