name: Production uptime

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check frontend
        shell: bash
        run: curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 90 https://www.cealeg.shop/ > /dev/null

      - name: Check backend health and version
        shell: bash
        run: |
          health="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 90 https://cealeg-api.onrender.com/health)"
          version="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 90 https://cealeg-api.onrender.com/version)"
          python - "$health" "$version" <<'PY'
          import json
          import sys

          health = json.loads(sys.argv[1])
          version = json.loads(sys.argv[2])
          assert health.get("ok") is True
          assert version.get("ok") is True
          assert version.get("commit")
          PY
