name: Encrypted production backup

on:
  schedule:
    # One encrypted recovery point per week keeps artifact storage within the
    # free GitHub quota. Run workflow_dispatch before risky production changes.
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_STORAGE_BUCKETS: product-images,product-submissions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$BACKUP_ENCRYPTION_KEY"

      - name: Install backup dependencies
        run: python -m pip install "requests==2.34.2"

      - name: Export database and Storage
        shell: bash
        run: bash scripts/backup-supabase.sh backup

      - name: Encrypt backup
        shell: bash
        run: |
          tar -C backup -czf - database storage checksums.sha256 backup-info.txt | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_ENCRYPTION_KEY -out cealeg-backup.tar.gz.enc
          test -s cealeg-backup.tar.gz.enc
          sha256sum cealeg-backup.tar.gz.enc > cealeg-backup.tar.gz.enc.sha256

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: cealeg-production-backup-${{ github.run_id }}
          path: |
            cealeg-backup.tar.gz.enc
            cealeg-backup.tar.gz.enc.sha256
          retention-days: 7
          if-no-files-found: error
