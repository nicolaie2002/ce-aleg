services:
  - type: redis
    name: cealeg-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
  - type: web
    name: cealeg-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 4 --timeout 60 --graceful-timeout 30 --keep-alive 5
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: ALLOW_DEV_TUNNEL_ORIGINS
        value: "false"
      - key: EXPOSE_DEV_AUTH_LINKS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_ENABLED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: FREE_MONTHLY_SCAN_LIMIT
        value: "5"
      - key: FRONTEND_PUBLIC_URL
        value: https://www.cealeg.shop
      - key: FRONTEND_ORIGINS
        value: https://www.cealeg.shop,https://cealeg.shop,https://ce-aleg.vercel.app
      - key: SUPABASE_PRODUCT_IMAGES_BUCKET
        value: product-images
      - key: SUPABASE_SUBMISSIONS_BUCKET
        value: product-submissions
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_API_VERSION
        sync: false
      - key: STRIPE_MAX_NETWORK_RETRIES
        value: "2"
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_PRO_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_FAMILY_PRICE_ID
        sync: false
      - key: STRIPE_FAMILY_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_CECOINS_BRONZE_PRICE_ID
        sync: false
      - key: STRIPE_CECOINS_GOLD_PRICE_ID
        sync: false
      - key: STRIPE_CECOINS_DIAMOND_PRICE_ID
        sync: false
      - key: STRIPE_AUTOMATIC_TAX
        value: "false"
      - key: STRIPE_TAX_ID_COLLECTION
        value: "false"
      - key: PASSWORD_MIN_LENGTH
        value: "12"
      - key: PASSWORD_RESET_MAX_AGE
        value: "3600"
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_SMTP_HOST
        sync: false
      - key: EMAIL_SMTP_PORT
        sync: false
      - key: EMAIL_SMTP_USERNAME
        sync: false
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Ce aleg?
      - key: CONTACT_EMAIL
        value: contact@cealeg.shop
      - key: CRON_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: TERMS_VERSION
        value: "2026-07"
      - key: SEARCH_RETENTION_DAYS
        value: "180"
      - key: ANALYTICS_RETENTION_DAYS
        value: "365"
      - key: SCAN_FILE_RETENTION_DAYS
        value: "30"
      - key: REJECTED_SUBMISSION_RETENTION_DAYS
        value: "90"
      - key: CATALOG_QUALITY_ALERT_THRESHOLD
        value: "65"
      - key: EXTERNAL_CATALOG_ENABLED
        value: "true"
      - key: OPEN_PRICES_ENABLED
        value: "true"
      - key: SUBMISSION_DAILY_LIMIT
        value: "10"
      - key: SUBMISSION_PENDING_LIMIT
        value: "20"
      - key: VISION_PROVIDER
        value: local
      - key: ENABLE_OPENAI_VISION
        value: "false"
      - key: OPENAI_VISION_TIMEOUT
        value: "20"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: AUTH_RATE_LIMIT
        value: "5"
      - key: AUTH_RATE_LIMIT_WINDOW
        value: "900"
      - key: GLOBAL_RATE_LIMIT
        value: "180"
      - key: GLOBAL_RATE_LIMIT_WINDOW
        value: "60"
      - key: MAX_JSON_BODY_BYTES
        value: "1048576"
